<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172217">
  <title>Journey P｜角色主頁</title>
  <meta name="description" content="把任務與個人成長化為一場看得見的冒險。">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Silkscreen:wght@400;700&display=swap');
    :root{--wood:#6c3e1d;--wood-dark:#2b170b;--gold:#b98a3e;--ink:#292116;--paper:#d8c49e;--green:#173923;--cream:#f0e2c2}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,#34402c,#10130f 72%);color:var(--cream);font-family:'Noto Serif TC','Microsoft JhengHei',serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.1;background-image:linear-gradient(#fff2 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:4px 4px}
    .layout{width:min(1180px,calc(100vw - 40px));height:min(720px,calc(100vh - 40px));display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;padding:14px;border:5px solid #3a210e;outline:3px solid #a16d31;border-radius:6px;background:repeating-linear-gradient(88deg,#6e3f1d 0,#7f4b23 8px,#5c3217 15px,#76431f 23px);box-shadow:inset 0 0 0 4px #b27738,inset 0 0 28px #241106,0 22px 70px #000}
    .wood-menu{align-self:center;display:flex;flex-direction:column;gap:10px;padding:22px 8px 12px;border:3px solid #3a210e;outline:2px solid #9b642b;border-radius:4px;background:repeating-linear-gradient(88deg,#6e3f1d 0,#7f4b23 7px,#5c3217 13px,#76431f 20px);box-shadow:inset 0 0 0 3px #b27738,inset 0 0 18px #241106;position:relative}.wood-menu:before{content:"";position:absolute;left:12px;right:12px;top:-10px;height:17px;border:2px solid #40240f;background:linear-gradient(#b27a39,#633617);box-shadow:inset 0 0 0 2px #d09a52}.wood-slot{position:relative;min-height:43px;padding:4px 5px 4px 14px;border:2px solid #38200e;border-radius:3px;background:radial-gradient(circle at 45% 42%,#392313,#1b120c 72%);box-shadow:inset 0 0 0 2px #8b592b,inset 0 0 10px #000,0 2px 3px #2b1509;color:#e8cc94;font:700 .75rem/1.2 inherit;letter-spacing:.03em;text-shadow:1px 2px #000;white-space:nowrap;cursor:pointer}.wood-slot:before{content:"";position:absolute;left:7px;top:50%;width:5px;height:5px;border:1px solid #b68446;transform:translateY(-50%) rotate(45deg)}.wood-slot:hover,.wood-slot:focus-visible{color:#fff0c9;border-color:#d09a52;outline:1px solid #f0bd69;filter:brightness(1.12)}
    .game{min-width:0;position:relative;display:grid;grid-template-columns:46% 54%;overflow:hidden;border:5px solid #4a2b12;outline:3px solid #a37232;background:#171912;box-shadow:0 0 0 4px #241409,inset 0 0 0 3px #c08a40,0 12px 30px #000}
    .game-header{position:absolute;z-index:8;left:17px;right:17px;top:14px;height:55px;display:flex;align-items:center;justify-content:center;pointer-events:none}.page-title{min-width:280px;padding:8px 30px 10px;text-align:center;border:3px solid #9c7135;outline:2px solid #182016;background:linear-gradient(#25482e,#152d1d);box-shadow:inset 0 0 0 2px #4d6f45,0 4px 9px #000a;color:#efe2c2;font-size:1.65rem;font-weight:900;letter-spacing:.2em;text-shadow:2px 2px #000}.clock{position:absolute;right:0;padding:7px 10px;border:2px solid #9c7135;background:#101a15;color:#efd477;font:700 .75rem/1 'Silkscreen',monospace;letter-spacing:.04em;box-shadow:inset 0 0 0 2px #314a36,2px 3px #000}
    .scene{position:relative;min-width:0;border-right:4px solid #6d4a25;background:#1a2118}.scene>img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;image-rendering:pixelated}.scene:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 32px #0009}.identity{position:absolute;z-index:4;left:16px;right:16px;bottom:58px;padding:9px 12px;border:2px solid #826b35;outline:2px solid #172114;background:#13291be8;box-shadow:inset 0 0 0 2px #3e5b35,0 3px 10px #000}.name-row{display:flex;align-items:center;gap:8px}.name{font-size:1.3rem;font-weight:900;color:#f0dfbd;cursor:pointer;text-shadow:2px 2px #000}.edit-name{margin-left:auto;width:28px;height:27px;border:1px solid #8d713b;background:#1d2b1e;color:#e3c681;cursor:pointer}.name-input{width:150px;border:0;border-bottom:2px solid #d0a353;outline:0;background:#0c130e;color:#f0dfbd;font:900 1.1rem inherit;padding:1px 4px}.mood{margin-top:2px;color:#c7b994;font-size:.8rem}.hidden{display:none!important}
    .sheet{min-width:0;padding:82px 18px 58px;background:linear-gradient(100deg,#e3d2ae,#cdb58a);color:var(--ink);box-shadow:inset 12px 0 20px #6d543629;display:flex;flex-direction:column;gap:10px}.ribbon{position:relative;align-self:center;min-width:58%;padding:6px 24px;text-align:center;color:#f0e3c3;font-weight:900;font-size:1rem;letter-spacing:.12em;background:linear-gradient(#285033,#16351f);border:2px solid #8c7440;outline:1px solid #17301d;box-shadow:inset 0 0 0 2px #476139,2px 3px #0006}.ribbon:before,.ribbon:after{content:"◆";position:absolute;top:50%;transform:translateY(-50%);color:#d5ad58;font-size:.65rem}.ribbon:before{left:8px}.ribbon:after{right:8px}
    .profession{display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px;padding:1px 7px 8px;border-bottom:2px solid #aa946d}.profession h2{margin:0;font-size:1.45rem}.profession-meta{display:flex;gap:10px;align-items:center;font:700 .75rem 'Silkscreen',monospace;color:#71541d}.coin{display:inline-grid;place-items:center;width:20px;height:20px;border:2px solid #6e5118;border-radius:50%;background:#c99b27;color:#fff0a3;font-size:.55rem;box-shadow:inset 0 0 0 2px #f0cb58}
    .exp-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font:700 .9rem 'Silkscreen',monospace}.track{height:15px;padding:2px;border:2px solid #72582f;outline:1px solid #231b11;background:#17140e;box-shadow:inset 0 0 5px #000}.fill{display:block;height:100%;background:repeating-linear-gradient(90deg,#8ab34d 0 9px,#668d38 9px 12px);box-shadow:inset 0 2px #c6df78}.section-label{width:max-content;margin-top:1px;padding:4px 22px;color:#f0e3c3;background:#1d4329;border:2px solid #816d3c;box-shadow:inset 0 0 0 1px #4d6945;font-weight:900;letter-spacing:.1em}
    .attributes{display:grid;gap:6px}.attribute{display:grid;grid-template-columns:24px 46px 1fr auto;grid-template-rows:auto 11px;column-gap:7px;align-items:center;padding:5px 8px;border-bottom:1px solid #b19a73}.attribute-icon{grid-row:1;width:22px;height:22px;display:grid;place-items:center;font-size:1.05rem}.attribute-name{font-weight:900}.attribute-value{font:700 .7rem 'Silkscreen',monospace;color:#634b1e}.attribute .track{grid-column:1/-1;grid-row:2;height:10px}.hp-fill{width:80%;background:linear-gradient(#ed666c,#ba3442)}.focus-fill{width:72%;background:linear-gradient(#5e9bea,#3264bd)}.spirit-fill{width:64%;background:linear-gradient(#e7c64b,#b48b20)}
    .skills{display:grid;grid-template-columns:1fr 1fr;gap:7px}.skill{display:grid;grid-template-columns:34px 1fr auto;gap:7px;align-items:center;min-width:0;padding:7px;border:1px solid #b39b73;background:#d9c39b66}.skill-icon{width:32px;height:32px;display:grid;place-items:center;border:2px solid #75603f;background:#f0dfb8;font-size:1.15rem}.skill strong{display:block;font-size:.86rem}.skill small{display:block;color:#5b4b37;font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.skill-level{font:700 .62rem 'Silkscreen',monospace}
    .hud{grid-column:1/-1;position:absolute;z-index:6;left:12px;right:12px;bottom:9px;height:42px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;gap:8px;padding:6px 13px;border:2px solid #826b35;outline:2px solid #172114;background:linear-gradient(#18351f,#0f2417);box-shadow:inset 0 0 0 2px #405a2e,0 -3px 12px #0009;color:#ebddbb}.hud-item{display:flex;align-items:center;justify-content:center;gap:7px;font:700 .68rem 'Silkscreen',monospace;white-space:nowrap}.hud-item i{font-style:normal;font-size:1.15rem}.hud-track{width:70px;height:10px;padding:1px;border:1px solid #8e753e;background:#090c09}.hud-track span{display:block;width:15%;height:100%;background:#86a64a}.toast{position:fixed;z-index:20;left:50%;bottom:13px;transform:translate(-50%,20px);padding:9px 16px;border:2px solid #b58945;background:#17291b;color:#f1dfb8;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:980px){.layout{grid-template-columns:1fr;width:calc(100vw - 24px)}.wood-menu{display:none}.game{grid-template-columns:44% 56%}.skills{grid-template-columns:1fr}.skill:nth-child(n+3){display:none}.page-title{min-width:230px;font-size:1.25rem}.clock{font-size:.6rem}.sheet{padding-left:12px;padding-right:12px}}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="wood-menu" aria-label="主要選單">
      <button class="wood-slot">QUEST</button><button class="wood-slot">SKILLS</button><button class="wood-slot">信仰&amp;真實</button><button class="wood-slot">角色日誌</button><button class="wood-slot">查看信箱</button>
    </aside>
    <main class="game">
      <header class="game-header"><div class="page-title">角色主頁</div><time class="clock" id="clock">00:00:00</time></header>
      <section class="scene" aria-label="角色場景">
        <img src="static/office-adventurer.png" alt="在奇幻書房工作的像素風精靈冒險者">
        <div class="identity"><div class="name-row"><span class="name" id="name" tabindex="0">亞倫</span><input id="name-input" class="name-input hidden" maxlength="12" aria-label="角色名字"><button id="edit-name" class="edit-name" aria-label="修改角色名字">✎</button></div><div class="mood">今天也在現實世界累積經驗。</div></div>
      </section>
      <section class="sheet" aria-label="角色資料">
        <div class="ribbon">💼 職業</div>
        <div class="profession"><h2>初階打工人</h2><div class="profession-meta"><span>Lv.1</span><span><i class="coin">G</i> 150</span></div></div>
        <div class="exp-row"><span>EXP</span><div class="track"><span class="fill" style="width:15%"></span></div><span>15 / 100</span></div>
        <div class="section-label">✦ 屬性</div>
        <div class="attributes">
          <div class="attribute"><span class="attribute-icon">❤️</span><span class="attribute-name">體力</span><span></span><strong class="attribute-value">80 / 100</strong><div class="track"><span class="fill hp-fill"></span></div></div>
          <div class="attribute"><span class="attribute-icon">🔵</span><span class="attribute-name">專注</span><span></span><strong class="attribute-value">72 / 100</strong><div class="track"><span class="fill focus-fill"></span></div></div>
          <div class="attribute"><span class="attribute-icon">⚡</span><span class="attribute-name">心力</span><span></span><strong class="attribute-value">64 / 100</strong><div class="track"><span class="fill spirit-fill"></span></div></div>
        </div>
        <div class="section-label">✦ 技能</div>
        <div class="skills">
          <div class="skill"><span class="skill-icon">📊</span><div><strong>Excel 入門</strong><small>數據處理效率 +5%</small></div><span class="skill-level">Lv.1</span></div>
          <div class="skill"><span class="skill-icon">✉️</span><div><strong>郵件回覆</strong><small>回覆壓力 -5</small></div><span class="skill-level">Lv.1</span></div>
          <div class="skill"><span class="skill-icon">☕</span><div><strong>咖啡提神</strong><small>專注力暫時提升</small></div><span class="skill-level">Lv.1</span></div>
          <div class="skill"><span class="skill-icon">🏃</span><div><strong>下班衝刺</strong><small>下班速度 +10%</small></div><span class="skill-level">Lv.1</span></div>
        </div>
      </section>
      <footer class="hud"><div class="hud-item"><i>❤️</i><span>80 / 100</span></div><div class="hud-item"><i>⚡</i><span>64 / 100</span></div><div class="hud-item"><i>🪙</i><span>150</span></div><div class="hud-item"><span>EXP</span><span class="hud-track"><span></span></span><span>15 / 100</span></div></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const clock=document.querySelector('#clock');const tick=()=>{const d=new Date();clock.textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':')};tick();setInterval(tick,1000);
    const toast=document.querySelector('#toast');const notify=message=>{toast.textContent=message;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),1700)};
    document.querySelectorAll('.wood-slot').forEach(button=>button.addEventListener('click',()=>notify(`${button.textContent} 功能準備中 ✦`)));
    const name=document.querySelector('#name'),input=document.querySelector('#name-input'),edit=document.querySelector('#edit-name'),key='journeyP.characterName';try{name.textContent=localStorage.getItem(key)||'亞倫'}catch{}
    const startEdit=()=>{input.value=name.textContent.trim();name.classList.add('hidden');input.classList.remove('hidden');input.focus();input.select()};const finishEdit=save=>{const value=input.value.trim().slice(0,12);if(save&&value){name.textContent=value;try{localStorage.setItem(key,value)}catch{}notify('角色名字已儲存 ✦')}input.classList.add('hidden');name.classList.remove('hidden')};edit.addEventListener('click',startEdit);name.addEventListener('click',startEdit);name.addEventListener('keydown',event=>{if(event.key==='Enter'){startEdit()}});input.addEventListener('keydown',event=>{if(event.key==='Enter')finishEdit(true);if(event.key==='Escape')finishEdit(false)});input.addEventListener('blur',()=>finishEdit(true));
  </script>
</body>
</html>
