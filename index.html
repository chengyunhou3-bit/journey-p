<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Journey P｜角色主頁</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap');
    :root{--green:#17351f;--gold:#a57b38;--ink:#251d13;--paper:#ddc9a2;--line:#ad9670}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#11130f}body{display:grid;place-items:center;padding:12px;color:var(--ink);font-family:'Noto Serif TC','Microsoft JhengHei',serif}
    .frame{position:relative;width:min(1370px,calc(100vw - 24px));aspect-ratio:1.245;max-height:calc(100vh - 24px);border:8px solid #3b250f;outline:4px solid #9c7034;background:#322314;box-shadow:inset 0 0 0 3px #c0944f,0 18px 65px #000;overflow:hidden}
    .book{position:absolute;inset:14px 14px 68px;display:grid;grid-template-columns:54% 46%;border:4px solid #3c2d19;box-shadow:0 0 0 3px #91703a,inset 0 0 22px #0008}
    .scene{position:relative;min-width:0;overflow:hidden;border-right:5px solid #70532c;background:#182016}
    .scene>img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 47%;image-rendering:pixelated;filter:saturate(.9) sepia(.08)}
    .scene:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 34px #0009}
    .title{position:absolute;z-index:3;left:0;top:0;width:73%;height:82px;display:grid;place-items:center;border:4px solid #71572f;border-top:0;background:linear-gradient(#284b31,#15321e);box-shadow:inset 0 0 0 3px #496441,4px 5px 10px #0008;color:#f0e3c7;font-size:2.45rem;font-weight:900;letter-spacing:.15em;text-shadow:2px 3px #000}.title:before,.title:after{content:"❧";position:absolute;color:#aeb46d;font-size:1.4rem}.title:before{left:11%}.title:after{right:11%;transform:scaleX(-1)}
    .equipment{position:absolute;z-index:3;left:0;right:0;bottom:0;height:165px;padding:36px 13px 10px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;border-top:5px solid #6e542e;background:linear-gradient(#e1cfaa,#c9ae7e);box-shadow:inset 0 0 0 3px #a88958;color:#2b2217}
    .tag{position:absolute;left:10px;top:-19px;min-width:150px;padding:6px 22px;text-align:center;border:3px solid #856d3c;background:linear-gradient(#21462b,#12321d);box-shadow:inset 0 0 0 2px #4e6946;color:#f1e2bf;font-size:1.2rem;font-weight:900;letter-spacing:.08em}
    .gear{min-width:0;display:grid;grid-template-rows:1fr auto;place-items:center;border:3px solid #a58e68;background:#d5bd91;box-shadow:inset 0 0 0 2px #e8d7b7}.gear-icon{font-size:2.25rem;filter:drop-shadow(2px 2px 0 #775f38)}.gear-name{width:100%;padding:3px;text-align:center;font-size:.95rem;font-weight:700;white-space:nowrap}.locked{background:#76664f;color:#bca982}.locked .gear-icon{filter:grayscale(1) brightness(.45)}
    .sheet{min-width:0;padding:30px 30px 20px;background:linear-gradient(100deg,#ead9b7,#d2ba8d);box-shadow:inset 14px 0 24px #61472e2e;color:var(--ink)}
    .section-ribbon{position:relative;width:78%;margin:0 auto 20px;padding:8px 20px;text-align:center;border:3px solid #826d3b;background:linear-gradient(#285033,#15351f);box-shadow:inset 0 0 0 2px #4b6744;color:#f2e4c7;font-size:1.2rem;font-weight:900;letter-spacing:.12em}
    .profession{text-align:center;padding:0 12px 18px;border-bottom:3px solid #ab936b}.profession h1{margin:0 0 16px;font-size:2.25rem;letter-spacing:.06em}.exp{display:grid;grid-template-columns:auto 1fr auto;gap:15px;align-items:center;font-size:1.15rem;font-weight:700}.bar{height:22px;padding:3px;border:3px solid #55401f;background:#17140f;box-shadow:inset 0 0 5px #000}.bar span{display:block;height:100%;background:linear-gradient(#b7d46a,#6f9b39);box-shadow:inset 0 2px #ddec91}
    .section{position:relative;margin-top:42px;padding:30px 26px 12px;border:3px solid #b39a70;box-shadow:inset 0 0 0 1px #ead9b7}.section>.tag{top:-24px;left:-2px;min-width:170px}.row{display:grid;grid-template-columns:42px 1fr auto;align-items:center;min-height:55px;border-bottom:2px solid #c2aa82;font-size:1.22rem}.row:last-child{border-bottom:0}.icon{font-size:1.65rem}.value{font-size:1.2rem;font-weight:700}.skill{grid-template-columns:52px 1fr auto;min-height:71px}.skill strong{display:block;font-size:1.15rem}.skill small{display:block;margin-top:2px;font-size:.88rem}.level{align-self:start;padding-top:10px;font-size:1rem;font-weight:700}
    .hud{position:absolute;left:14px;right:14px;bottom:10px;height:54px;display:grid;grid-template-columns:1fr 1fr .8fr 1.6fr;align-items:center;border:3px solid #7d6332;background:linear-gradient(#183820,#102817);box-shadow:inset 0 0 0 2px #405b35;color:#eee0bd}.hud-item{display:flex;justify-content:center;align-items:center;gap:13px;font-size:1.15rem;white-space:nowrap}.hud-icon{font-size:1.7rem}.hud .bar{width:150px;height:16px;padding:2px;border-width:2px}
    @media(max-width:900px){body{overflow:auto}.frame{width:100%;max-height:none;aspect-ratio:auto;height:1050px}.book{grid-template-columns:1fr;grid-template-rows:52% 48%;bottom:64px}.scene{border-right:0;border-bottom:5px solid #70532c}.sheet{padding:22px}.title{height:64px;font-size:1.65rem}.equipment{height:132px;padding-top:30px}.gear-icon{font-size:1.7rem}.profession h1{font-size:1.65rem}.section{margin-top:34px}.skills-section .row:nth-child(n+4){display:none}.hud{grid-template-columns:repeat(3,1fr)}.hud-item:last-child{display:none}}
  </style>
</head>
<body>
  <main class="frame">
    <div class="book">
      <section class="scene" aria-label="角色工作場景">
        <img src="static/office-adventurer.png" alt="在溫暖書房工作的精靈角色">
        <div class="title">角色主頁</div>
        <div class="equipment">
          <div class="tag">✦ 裝備</div>
          <div class="gear"><span class="gear-icon">🧢</span><span class="gear-name">精靈帽</span></div>
          <div class="gear"><span class="gear-icon">🧥</span><span class="gear-name">綠葉披風</span></div>
          <div class="gear"><span class="gear-icon">👓</span><span class="gear-name">眼鏡</span></div>
          <div class="gear"><span class="gear-icon">🏅</span><span class="gear-name">打工證</span></div>
          <div class="gear"><span class="gear-icon">☕</span><span class="gear-name">保溫杯</span></div>
          <div class="gear locked"><span class="gear-icon">🔒</span><span class="gear-name">未解鎖</span></div>
        </div>
      </section>
      <section class="sheet" aria-label="角色資料">
        <div class="section-ribbon">💼　職業</div>
        <div class="profession">
          <h1>✦ 初階打工人 Lv.1 ✦</h1>
          <div class="exp"><span>EXP</span><div class="bar"><span style="width:15%"></span></div><span>15 / 100</span></div>
        </div>
        <div class="section">
          <div class="tag">✦ 屬性</div>
          <div class="row"><span class="icon">❤️</span><strong>體力</strong><span class="value">80 / 100</span></div>
          <div class="row"><span class="icon">💡</span><strong>智力</strong><span class="value">12</span></div>
          <div class="row"><span class="icon">💪</span><strong>抗壓</strong><span class="value">8</span></div>
          <div class="row"><span class="icon">🪙</span><strong>薪水</strong><span class="value">150 🪙</span></div>
        </div>
        <div class="section skills-section">
          <div class="tag">✦ 技能</div>
          <div class="row skill"><span class="icon">📊</span><div><strong>Excel 入門</strong><small>提升數據處理效率 +5%</small></div><span class="level">Lv.1</span></div>
          <div class="row skill"><span class="icon">✉️</span><div><strong>郵件回覆</strong><small>快速回覆郵件，減少壓力 +5</small></div><span class="level">Lv.1</span></div>
          <div class="row skill"><span class="icon">☕</span><div><strong>咖啡提神</strong><small>短暫提升專注力（冷卻：2小時）</small></div><span class="level">Lv.1</span></div>
          <div class="row skill"><span class="icon">🏃</span><div><strong>下班衝刺</strong><small>下班速度 +10%</small></div><span class="level">Lv.1</span></div>
        </div>
      </section>
    </div>
    <footer class="hud">
      <div class="hud-item"><span class="hud-icon">❤️</span><span>80 / 100</span></div>
      <div class="hud-item"><span class="hud-icon">⚡</span><span>80 / 100</span></div>
      <div class="hud-item"><span class="hud-icon">🪙</span><span>150</span></div>
      <div class="hud-item"><span>EXP</span><div class="bar"><span style="width:15%"></span></div><span>15 / 100</span></div>
    </footer>
  </main>
</body>
</html>
